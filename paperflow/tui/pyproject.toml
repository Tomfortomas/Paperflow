[project]
name = "paperflow-tui"
version = "0.1.0"
description = "Paperflow TUI client — Textual-based terminal UI talking to the PaperFlow FastAPI backend"
requires-python = ">=3.9"
dependencies = [
  "textual>=0.60,<2.0",
  "httpx>=0.27",
  "rich>=13",
  "click>=8.1",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "respx",
]

[project.scripts]
paperflow-tui = "paperflow_tui.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["paperflow_tui*"]

[tool.setuptools.package-data]
paperflow_tui = ["*.tcss"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
